<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Umbrella - Akkodis Monolithic</title>
    <style>
        /* --- STILI CSS --- */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #87CEEB, #FFE4B5);
            overflow: hidden;
            perspective: 1200px;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 400px;
            transform-style: preserve-3d;
        }

        /* Ombra dinamica sulla sabbia */
        .shadow {
            position: absolute;
            left: 50%;
            top: 65%;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            transform: translate(-50%, -50%) rotateX(65deg);
            filter: blur(8px);
            transition: transform 1.2s ease-in-out, width 1.2s ease-in-out, height 1.2s ease-in-out;
            pointer-events: none;
        }

        /* Quando l'ombrellone è aperto, l'ombra diventa più grande */
        .shadow.expanded {
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.15);
        }

        .umbrella-container {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(65deg) rotateZ(0deg);
            animation: spin 14s infinite linear;
            cursor: pointer;
            pointer-events: auto;
        }

        @keyframes spin {
            from { transform: rotateX(65deg) rotateZ(0deg); }
            to { transform: rotateX(65deg) rotateZ(360deg); }
        }

        .pole {
            position: absolute;
            width: 12px;
            height: 350px;
            background: linear-gradient(to right, #d7ccc8, #8d6e63, #d7ccc8);
            left: 50%;
            top: 50%;
            transform: translate3d(-50%, -10%, 0) rotateX(-90deg);
            border-radius: 6px;
            pointer-events: none;
        }

        .canopy {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            pointer-events: none;
        }

        .segment {
            position: absolute;
            width: 0;
            height: 0;
            left: 50%;
            top: 50%;
            border-left: 40px solid transparent;
            border-right: 40px solid transparent;
            border-bottom: 150px solid red;
            transform-origin: top center;
            transform-style: preserve-3d;
            transition: all 1.2s ease-in-out; 
            pointer-events: none;
        }

        .brand-text {
            position: absolute;
            font-family: 'Arial Black', sans-serif;
            font-size: 10px;
            font-weight: bold;
            color: #ffffff;
            left: -27px; 
            top: 75px;
            width: 54px;
            text-align: center;
            letter-spacing: 1px;
            transform: translateZ(1px);
            backface-visibility: visible;
            pointer-events: none;
        }

        .seg-1 { --rotZ: 0deg; border-bottom-color: #0b0c10; }
        .seg-2 { --rotZ: 45deg; border-bottom-color: #ffffff; }
        .seg-3 { --rotZ: 90deg; border-bottom-color: #ff5252; }
        .seg-4 { --rotZ: 135deg; border-bottom-color: #ffffff; }
        .seg-5 { --rotZ: 180deg; border-bottom-color: #ff5252; }
        .seg-6 { --rotZ: 225deg; border-bottom-color: #ffffff; }
        .seg-7 { --rotZ: 270deg; border-bottom-color: #ff5252; }
        .seg-8 { --rotZ: 315deg; border-bottom-color: #ffffff; }

        /* Stato Chiuso */
        .umbrella-container.closed .segment {
            transform: translate(-50%, -50%) rotateZ(var(--rotZ)) rotateX(4deg);
        }

        /* Stato Aperto */
        .umbrella-container.open .segment {
            transform: translate(-50%, -50%) rotateZ(var(--rotZ)) rotateX(32deg);
        }

        .finial {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffeb3b;
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate3d(-50%, -50%, 4px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene">
        <div id="umbrella-shadow" class="shadow"></div>

        <div id="umbrella" class="umbrella-container closed">
            <div class="finial"></div>
            
            <div class="canopy">
                <div class="segment seg-1">
                    <span class="brand-text">AKKODIS</span>
                </div>
                <div class="segment seg-2"></div>
                <div class="segment seg-3"></div>
                <div class="segment seg-4"></div>
                <div class="segment seg-5"></div>
                <div class="segment seg-6"></div>
                <div class="segment seg-7"></div>
                <div class="segment seg-8"></div>
            </div>
            
            <div class="pole"></div>
        </div>
    </div>

    <!-- --- LOGICA JAVASCRIPT --- -->
    <script>
        const umbrella = document.getElementById('umbrella');
        const shadow = document.getElementById('umbrella-shadow');

        umbrella.addEventListener('click', () => {
            if (umbrella.classList.contains('closed')) {
                umbrella.classList.remove('closed');
                umbrella.classList.add('open');
                shadow.classList.add('expanded');
            } else {
                umbrella.classList.remove('open');
                umbrella.classList.add('closed');
                shadow.classList.remove('expanded');
            }
        });
    </script>
</body>
</html>
