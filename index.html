<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Opening & Closing Umbrella - Akkodis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="umbrella-container">
        <!-- Punta sferica superiore -->
        <div class="finial"></div>
        
        <!-- Cupola di tessuto mobile -->
        <div class="canopy">
            <!-- Il primo spicchio ospita il brand Akkodis -->
            <div class="segment seg-1">
                <span class="brand-text">AKKODIS</span>
            </div>
            <div class="segment seg-2"></div>
            <div class="segment seg-3"></div>
            <div class="segment seg-4"></div>
            <div class="segment seg-5"></div>
            <div class="segment seg-6"></div>
            <div class="segment seg-7"></div>
            <div class="segment seg-8"></div>
        </div>
        
        <!-- Asta centrale di supporto -->
        <div class="pole"></div>
    </div>

</body>
</html>
