<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mary Poppins Umbrella</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="rain-container" id="rainContainer"></div>

    <!-- Pannello dei pulsanti di controllo (Ora con un solo tasto di gestione cupola) -->
    <div class="controls">
        <button class="btn" id="rainBtn">Attiva Tempesta 🌪️</button>
        <button class="btn" id="toggleFoldBtn">Apri Ombrello ☂️</button>
        <button class="btn" id="singBtn">Informativa 🦜</button>
        <button class="btn btn-tactical" id="bladeBtn">Estrai Lama ⚔️</button>
        <button class="btn btn-tactical" id="sprayBtn">Spray Peperoncino 💨</button>
    </div>

    <div class="stage">
        <svg id="umbrella-svg" class="umbrella-svg closed" viewBox="0 -40 200 320" xmlns="http://w3.org">
			<defs>
				<!-- Gradienti di sfondo e tessuto -->
				<radialGradient id="canopyRealism" cx="50%" cy="30%" r="70%">
					<stop offset="0%" stop-color="#343a40" />
					<stop offset="60%" stop-color="#1a1d20" />
					<stop offset="100%" stop-color="#0b0c10" />
				</radialGradient>
				<radialGradient id="canopyRainRealism" cx="50%" cy="30%" r="70%">
					<stop id="rainbowStop1" offset="0%" stop-color="#434343" />
					<stop id="rainbowStop2" offset="100%" stop-color="#111111" />
				</radialGradient>
				<linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
					<stop offset="0%" stop-color="#7f8c8d" />
					<stop offset="30%" stop-color="#f5f6fa" />
					<stop offset="50%" stop-color="#ffffff" />
					<stop offset="70%" stop-color="#dcdde1" />
					<stop offset="100%" stop-color="#718093" />
				</linearGradient>
				<!-- GRADIENTE EFFETTO FUOCO -->
				<linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
					<stop offset="0%" stop-color="#b22222" />  
					<stop offset="40%" stop-color="#ff4500" /> 
					<stop offset="85%" stop-color="#ffa500" /> 
					<stop offset="100%" stop-color="#ffd700" />
				</linearGradient>
			</defs>

			<!-- LAMA INTERNA DI AUTODIFESA (Nascosta ma centrata nell'area utile) -->
			<g id="blade">
				<path d="M 96 110 L 96 -10 Q 100 -25 104 -10 L 104 110 Z" fill="url(#fireGrad)" stroke="#ff4500" stroke-width="0.5"/>
				<line x1="100" y1="100" x2="100" y2="-12" stroke="#ffd700" stroke-width="0.7" opacity="0.9"/>
			</g>

			<!-- Punta superiore dell'ombrello (Agganciata sopra la cupola) -->
			<line x1="100" y1="-5" x2="100" y2="10" stroke="#d4af37" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

			<!-- GRUPPO DELLA CUPOLA RIPIEGABILE -->
			<g id="canopy-group">
				<!-- Cupola in tessuto scuro con riflessi accentuati -->
				<path id="umbrella-canopy" d="M 0 120 Q 0 10 100 10 Q 200 10 200 120 Q 150 105 100 115 Q 50 105 0 120 Z" fill="url(#canopyRealism)" />
				
				<!-- Spicchi tridimensionali (Contrasto migliorato con grigio scuro) -->
				<path d="M 100 10 Q 45 65 50 108" stroke="#212529" stroke-width="1.2" opacity="0.5" fill="none" />
				<path d="M 100 10 Q 155 65 150 108" stroke="#212529" stroke-width="1.2" opacity="0.5" fill="none" />
				<path d="M 100 10 L 100 115" stroke="#212529" stroke-width="1.2" opacity="0.5" fill="none" />

				<!-- Cerchietti di finitura cromati delle stecche -->
				<circle cx="0" cy="120" r="2.2" fill="url(#chromeGrad)"/>
				<circle cx="50" cy="108" r="2.2" fill="url(#chromeGrad)"/>
				<circle cx="100" cy="115" r="2.2" fill="url(#chromeGrad)"/>
				<circle cx="150" cy="108" r="2.2" fill="url(#chromeGrad)"/>
				<circle cx="200" cy="120" r="2.2" fill="url(#chromeGrad)"/>
			</g>

			<!-- Asta centrale metallica (Allungata a Y=155 per raccordarsi stabilmente al manico in scala 0.5) -->
			<line x1="100" y1="115" x2="100" y2="155" stroke="#708090" stroke-width="3" stroke-linecap="round"/>

			<!-- MANICO: TESTA DI ARA GIALLO E BLU -->
			<g id="parrot-head" transform="translate(100, 155) scale(0.5)">
				<path d="M -5 0 C 15 -2 25 12 18 28 C 10 32 -2 25 -5 0" fill="#2980b9" />
				<path d="M -3 3 C 8 -3 16 0 16 10 C 8 8 -1 10 -3 3" fill="#27ae60" />
				<path d="M -6 -2 C -18 10 -15 28 -2 36 C 8 28 5 10 -6 -2" fill="#f1c40f" />
				<path d="M -12 6 C -3 6 4 14 -1 22 C -6 26 -14 20 -12 6" fill="#ffffff" />
				<path d="M -9 10 Q -4 10 -2 12" stroke="#111111" stroke-width="1" fill="none" />
				<path d="M -10 13 Q -5 14 -3 16" stroke="#111111" stroke-width="1" fill="none" />
				<path d="M -9 16 Q -6 18 -4 20" stroke="#111111" stroke-width="1" fill="none" />
				<circle cx="-5" cy="14" r="3.5" fill="#bdc3c7" />
				<circle cx="-5" cy="14" r="1.5" fill="#111111" />
				<path d="M -16 22 Q -12 28 -8 20 Z" fill="#2c3e50" />
				<path id="beak" d="M -14 8 C -26 8 -28 24 -16 26 C -14 24 -12 18 -14 8" fill="#111111" />
				<circle cx="-19" cy="18" r="1" fill="#ff4757" />
			</g>
		</svg>
    </div>

    <!-- Pannello dei sottotitoli dell'interfaccia -->
    <div class="subtitles-container">
        <div class="subtitles" id="subtext">Sistema Ombrello con dispositivi di Autodifesa Integrati</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
